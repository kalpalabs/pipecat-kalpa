[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pipecat-kalpa"
version = "0.1.1"
description = "Kalpa text-to-speech services for Pipecat"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kalpa Labs" }]
keywords = ["pipecat", "kalpa", "tts", "speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "aiohttp>=3.14,<4",
    "loguru>=0.7.3,<0.8",
    "pipecat-ai>=1.13.0,<1.14.0",
    "websockets>=13.1",
]

[project.optional-dependencies]
examples = ["pipecat-ai[deepgram,openai,runner,webrtc]>=1.13.0,<1.14.0"]

[project.urls]
Homepage = "https://kalpalabs.ai"
Documentation = "https://github.com/kalpalabs/pipecat-kalpa#readme"
Repository = "https://github.com/kalpalabs/pipecat-kalpa"
Issues = "https://github.com/kalpalabs/pipecat-kalpa/issues"
Changelog = "https://github.com/kalpalabs/pipecat-kalpa/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-aiohttp>=1.1,<2",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_kalpa"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", ".env.example", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ASYNC", "B", "D", "F", "I", "RUF006", "UP"]
ignore = ["ASYNC109", "B904", "D105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D"]
