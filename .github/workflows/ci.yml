name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest
      - run: uv run python examples/voice.py --help

  pipecat-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pipecat: ["==1.13.0", ">=1.13.0,<2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: >-
          uv pip install --upgrade-package pipecat-ai
          "pipecat-ai[deepgram,openai,runner,webrtc]${{ matrix.pipecat }}"
      - run: uv run --no-sync python -c "import importlib.metadata as m; print(m.version('pipecat-ai'))"
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python examples/voice.py --help

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv build
      - run: uv venv .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/*.whl
      - run: .wheel-venv/bin/python -c "from pipecat_kalpa import KalpaTTSService, KalpaHttpTTSService"
